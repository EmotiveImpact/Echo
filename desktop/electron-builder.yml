appId: com.hearback.desktop
productName: Hearback
electronVersion: 44.1.1
asar: true
npmRebuild: false
directories:
  output: ../artifacts/desktop
files:
  - dist/**
  - node_modules/**
  - package.json
extraResources:
  - from: companion
    to: companion
mac:
  category: public.app-category.productivity
  artifactName: Hearback-${version}-${arch}-mac.${ext}
  target:
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  category: Utility
  syncDesktopName: true
  target:
    - AppImage
  artifactName: Hearback-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: Hearback-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

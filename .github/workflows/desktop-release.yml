name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop
      - name: Build unsigned macOS zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          ./node_modules/.bin/electron-builder \
            --projectDir desktop \
            --config "$GITHUB_WORKSPACE/desktop/electron-builder.yml" \
            --mac zip \
            --${{ matrix.arch }} \
            --publish never 2>&1 | tee builder.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hearback-macOS-${{ matrix.arch }}
          path: artifacts/desktop/*.zip
      - name: Publish builder error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('builder.log') ? fs.readFileSync('builder.log', 'utf8') : 'no builder.log';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Desktop Mac ${{ matrix.arch }} build failed`,
              body: '```\n' + log.slice(-6000) + '\n```'
            });

  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          ./node_modules/.bin/electron-builder \
            --projectDir desktop \
            --config "$GITHUB_WORKSPACE/desktop/electron-builder.yml" \
            --linux AppImage \
            --publish never 2>&1 | tee builder.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hearback-Linux
          path: artifacts/desktop/*.AppImage
      - name: Publish builder error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('builder.log') ? fs.readFileSync('builder.log', 'utf8') : 'no builder.log';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Desktop Linux build failed',
              body: '```\n' + log.slice(-6000) + '\n```'
            });

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Hearback ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.AppImage
          body: |
            macOS will say the unsigned app is damaged. That is Gatekeeper.

            After unzipping, either double-click **Open Hearback.command**, or run:

            ```
            xattr -cr /path/to/Hearback.app
            open /path/to/Hearback.app
            ```

            - **Apple Silicon Mac:** `Hearback-0.1.5-arm64-mac.zip`
            - **Intel Mac:** `Hearback-0.1.5-x64-mac.zip`

name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Build Echo
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package .app zip
        run: |
          mkdir -p artifacts/desktop
          bash packaging/package-macos.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Echo-macOS-${{ matrix.arch }}
          path: artifacts/desktop/*.zip
      - name: Publish builder error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Echo Mac ${{ matrix.arch }} build failed`,
              body: 'Native Rust build failed. Check the Actions log.'
            });

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Echo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
          body: |
            Echo is a native Mac app. No browser tab. No localhost server.

            macOS will say the unsigned app is damaged. That is Gatekeeper.

            Unzip into Downloads. Then double-click **Open Echo.command**, or run:

            ```
            xattr -cr ~/Downloads/Echo.app
            open ~/Downloads/Echo.app
            ```

            - **Apple Silicon Mac:** `Echo-0.2.1-arm64-mac.zip`
            - **Intel Mac:** `Echo-0.2.1-x64-mac.zip`

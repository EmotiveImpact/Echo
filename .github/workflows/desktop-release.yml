name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop
      - name: Build unsigned macOS zip and DMG
        run: npx electron-builder --projectDir desktop --config electron-builder.yml --mac zip dmg --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Hearback-macOS-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run package:desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Hearback-Linux
          path: artifacts/desktop/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Hearback ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          body: |
            Download **Hearback** and run it.

            - **Apple Silicon Mac:** `Hearback-0.1.0-arm64-mac.zip` or the arm64 DMG
            - **Intel Mac:** `Hearback-0.1.0-mac.zip` or the x64 DMG
            - **Linux:** AppImage

            These builds are unsigned. On macOS: unzip, right-click **Hearback**, choose **Open**, then confirm.

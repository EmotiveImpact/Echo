name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop
      - name: Build unsigned macOS zip and DMG
        run: npx electron-builder --projectDir desktop --config electron-builder.yml --mac --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Hearback-macOS-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop
      - run: npx electron-builder --projectDir desktop --config electron-builder.yml --linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Hearback-Linux
          path: artifacts/desktop/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Hearback ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          body: |
            Download Hearback and run it.

            - **Apple Silicon Mac:** `Hearback-0.1.1-arm64-mac.zip`
            - **Intel Mac:** `Hearback-0.1.1-x64-mac.zip`
            - **Linux:** AppImage

            These builds are unsigned. On macOS: unzip, right-click **Hearback**, choose **Open**, then confirm.

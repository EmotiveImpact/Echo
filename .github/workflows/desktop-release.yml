name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: arm64
          - arch: x86_64
            label: x64
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate icons
        run: python3 macos/scripts/generate-icon.py
      - name: Build Echo.app
        run: |
          cd macos
          xcodegen generate
          set -o pipefail
          if ! xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -derivedDataPath DerivedData \
            ARCHS=${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            2>&1 | tee build.log
          then
            echo "---- xcodebuild errors ----"
            grep -E "error:|fatal error:" build.log || true
            exit 1
          fi
      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-${{ matrix.label }}
          path: macos/build.log
      - name: Package .app zip
        run: |
          bash packaging/package-swift-macos.sh ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Echo-macOS-${{ matrix.label }}
          path: artifacts/desktop/*.zip
      - name: Publish builder error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Echo Mac ${{ matrix.arch }} build failed`,
              body: 'SwiftUI Mac build failed. Check the Actions log.'
            });

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Echo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
          body: |
            Echo is a SwiftUI menu-bar Mac app. Copy a Cursor reply. It speaks.

            No skill. No Cursor Connect. No paid Apple signing for your own machine.

            macOS will say the unsigned app is damaged. That is Gatekeeper.

            Unzip into Downloads. That should leave `~/Downloads/Echo/Echo.app`. Then double-click **Open Echo.command**, or run:

            ```
            xattr -cr ~/Downloads/Echo/Echo.app
            open ~/Downloads/Echo/Echo.app
            ```

            - **Apple Silicon Mac:** `Echo-0.3.5-arm64-mac.zip`
            - **Intel Mac:** `Echo-0.3.5-x64-mac.zip`

            Default listen mode is **Cursor only**. Switch to **Apps** or **All** in the menu panel.
